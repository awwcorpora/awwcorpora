# Netlify configuration for AWW Corpora
# © 2026 Axel Wahyu Wicaksono / AWW Corpora. All Rights Reserved.
#
# ALUR KERJA:
#   Anda mengedit  index.html / portfolio-axel.html  di root repo
#   Netlify menjalankan    npm run build
#   Hasil minified masuk   dist/      <- inilah yang dipublikasikan
#
# Kalau build gagal, Netlify TIDAK menerbitkan apa pun dan situs lama tetap
# hidup. Jadi salah ketik tidak akan pernah merusak situs yang sudah live.

[build]
  command = "npm run build"
  publish = "dist"                # hasil build, dibuat otomatis — JANGAN diedit
  functions = "netlify/functions" # serverless functions (AWW AI)

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"


# ---------------------------------------------------------------------------
# Header keamanan untuk SEMUA halaman
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Situs lain tidak boleh menyematkan halaman Anda di dalam iframe mereka.
    X-Frame-Options = "DENY"

    # Browser tidak boleh menebak-nebak tipe file.
    X-Content-Type-Options = "nosniff"

    # Alamat halaman Anda tidak bocor lengkap saat orang klik keluar.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Paksa HTTPS selama 2 tahun, termasuk semua subdomain.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Matikan akses fitur perangkat yang memang tidak dipakai situs ini.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # PENTING — Content Security Policy.
    # Situs ini 100% mandiri: semua CSS & JS inline, tidak ada resource dari luar.
    #
    # ⚠ GAMBAR HANYA BOLEH DARI FOLDER assets/ MILIK ANDA SENDIRI.
    #   Gambar dari Imgur, Google Drive, Unsplash, atau CDN mana pun akan
    #   DIBLOKIR dan tidak tampil. Simpan gambar di assets/, panggil dengan
    #   /assets/nama-file.jpg
    #
    # ⚠ KALAU MENAMBAH RESOURCE LUAR, daftarkan domainnya di sini. Contoh
    #   untuk Google Fonts:
    #     style-src  ... https://fonts.googleapis.com;
    #     font-src   ... https://fonts.gstatic.com;
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests"


# ---------------------------------------------------------------------------
# CV — jangan diindeks mesin pencari
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, noarchive, nosnippet, noimageindex"
    Content-Disposition = "inline"


# ---------------------------------------------------------------------------
# Gambar & aset — cache lama supaya situs cepat
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"


# ---------------------------------------------------------------------------
# Halaman HTML — selalu ambil versi terbaru setelah deploy
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
